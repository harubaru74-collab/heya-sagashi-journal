<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>はるかちゃんのお部屋探しジャーナル</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yomogi&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header class="top">
    <h1>🏠 はるかちゃんのお部屋探しジャーナル</h1>
    <p class="sub">LINEで送った物件を自動で比較・スコアリングするよ✨</p>
  </header>

  <div class="criteria-box" id="criteria-box">条件を読み込み中…</div>

  <div class="list-controls">
    <select id="sort-select">
      <option value="scoreTotal:desc">マッチ度が高い順</option>
      <option value="rentTotal:asc">家賃が安い順</option>
      <option value="commuteMinutes:asc">通勤が短い順</option>
      <option value="sizeSqm:desc">広い順</option>
    </select>
    <label class="show-hidden-toggle">
      <input type="checkbox" id="show-hidden-checkbox">「見送り」「掲載終了」も表示
    </label>
  </div>

  <details class="filter-panel">
    <summary>🔍 フィルターで絞り込む</summary>
    <div class="filter-body">
      <div class="filter-group">
        <span class="filter-group-label">駅までの徒歩</span>
        <select id="walk-select">
          <option value="">指定なし</option>
          <option value="5">5分以内</option>
          <option value="10">10分以内</option>
          <option value="15">15分以内</option>
          <option value="20">20分以内</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-group-label">お部屋の条件</span>
        <div class="room-filter-mode" id="room-filter-mode">
          <label><input type="radio" name="room-filter-mode" value="and" checked>すべて満たす(AND)</label>
          <label><input type="radio" name="room-filter-mode" value="or">いずれか満たす(OR)</label>
        </div>
        <div id="room-filter-checks" class="room-filter-checks"></div>
      </div>
      <button type="button" id="filter-reset-btn" class="filter-reset-btn">フィルターをリセット</button>
      <div class="filter-group preset-group">
        <span class="filter-group-label">保存した条件(<span id="preset-count">0</span>/10)</span>
        <div class="preset-save-row">
          <input type="text" id="preset-name-input" placeholder="条件の名前(例: 駅近・バストイレ別)" maxlength="20">
          <button type="button" id="preset-save-btn">💾 保存</button>
        </div>
        <div id="preset-list" class="preset-list"></div>
      </div>
    </div>
  </details>

  <div class="card-list" id="property-list"></div>

  <p style="text-align:center; margin-top:24px;">
    <a href="articles/higashi-shinagawa-tennouzu.html">📖 街紹介記事: 東品川・天王洲アイルエリア</a>
  </p>

  <footer class="site">heya-sagashi-journal ・ このページはURLを知っている人だけが見られる非公開運用だよ</footer>
</div>

<script src="app.js"></script>
<script>
(async function () {
  let criteria;
  try {
    criteria = await loadCriteria();
    document.getElementById("criteria-box").innerHTML =
      "家賃上限 <b>" + formatYen(criteria.rent.maxTotal) + "</b>(理想 " + formatYen(criteria.rent.idealTotal) + ") ・ " +
      "通勤先: <b>" + criteria.commute.destinationStationName + "</b>まで" + criteria.commute.idealMinutes + "分前後(最長" + criteria.commute.maxMinutes + "分) ・ " +
      "対象エリア: " + criteria.targetTowns.join("・");
  } catch (e) {
    document.getElementById("criteria-box").textContent = "条件の読み込みに失敗したよ";
    criteria = { roomConditions: [] };
  }

  const listEl = document.getElementById("property-list");
  const sortSelect = document.getElementById("sort-select");
  const hiddenCheckbox = document.getElementById("show-hidden-checkbox");
  const walkSelect = document.getElementById("walk-select");
  const roomChecksEl = document.getElementById("room-filter-checks");
  const modeEl = document.getElementById("room-filter-mode");
  const filterPanel = document.querySelector(".filter-panel");
  const resetBtn = document.getElementById("filter-reset-btn");
  const presetNameInput = document.getElementById("preset-name-input");
  const presetSaveBtn = document.getElementById("preset-save-btn");
  const presetListEl = document.getElementById("preset-list");
  const presetCountEl = document.getElementById("preset-count");

  const boolConditions = (criteria.roomConditions || []).filter((c) => c.type !== "scale");
  roomChecksEl.innerHTML = boolConditions.map((c) =>
    '<label><input type="checkbox" class="room-filter-checkbox" value="' + c.key + '">' + c.label + "のみ</label>"
  ).join("");

  // 前回開いたときのフィルター条件を復元(端末内のみ・localStorage)
  const saved = loadSavedListFilters();
  if (saved.sort) sortSelect.value = saved.sort;
  if (saved.includeHidden) hiddenCheckbox.checked = true;
  if (saved.maxWalkMinutes) walkSelect.value = String(saved.maxWalkMinutes);
  if (saved.roomFilterMode === "or") {
    const orRadio = modeEl.querySelector('input[value="or"]');
    if (orRadio) orRadio.checked = true;
  }
  if (saved.roomFilters && saved.roomFilters.length) {
    document.querySelectorAll(".room-filter-checkbox").forEach((cb) => {
      cb.checked = saved.roomFilters.indexOf(cb.value) !== -1;
    });
  }
  if (filterPanel && (saved.maxWalkMinutes || (saved.roomFilters && saved.roomFilters.length))) {
    filterPanel.open = true;
  }

  function currentRoomFilterMode() {
    const checked = modeEl.querySelector('input[name="room-filter-mode"]:checked');
    return checked ? checked.value : "and";
  }

  function currentFilterState() {
    return {
      sort: sortSelect.value,
      includeHidden: hiddenCheckbox.checked,
      maxWalkMinutes: walkSelect.value ? Number(walkSelect.value) : null,
      roomFilters: Array.from(document.querySelectorAll(".room-filter-checkbox:checked")).map((cb) => cb.value),
      roomFilterMode: currentRoomFilterMode()
    };
  }

  function refresh() {
    const state = currentFilterState();
    const [sortKey, sortDir] = state.sort.split(":");
    saveListFilters(state);
    renderPropertyList(listEl, null, {
      sortKey, sortDir, includeHiddenStatuses: state.includeHidden,
      roomFilters: state.roomFilters, roomFilterMode: state.roomFilterMode, maxWalkMinutes: state.maxWalkMinutes
    });
  }

  function applyFilterState(state) {
    if (state.sort) sortSelect.value = state.sort;
    hiddenCheckbox.checked = !!state.includeHidden;
    walkSelect.value = state.maxWalkMinutes ? String(state.maxWalkMinutes) : "";
    document.querySelectorAll(".room-filter-checkbox").forEach((cb) => {
      cb.checked = (state.roomFilters || []).indexOf(cb.value) !== -1;
    });
    const modeRadio = modeEl.querySelector('input[value="' + (state.roomFilterMode === "or" ? "or" : "and") + '"]');
    if (modeRadio) modeRadio.checked = true;
    refresh();
  }

  function renderPresetList() {
    const presets = loadFilterPresets();
    presetCountEl.textContent = String(presets.length);
    presetSaveBtn.disabled = presets.length >= 10;
    if (presets.length === 0) {
      presetListEl.innerHTML = '<p class="empty-note preset-empty">まだ保存した条件はないよ</p>';
      return;
    }
    presetListEl.innerHTML = presets.map((p) =>
      '<span class="preset-chip">' +
        '<button type="button" class="preset-apply-btn" data-id="' + p.id + '">' + p.name + "</button>" +
        '<button type="button" class="preset-del-btn" data-id="' + p.id + '" aria-label="削除">×</button>' +
      "</span>"
    ).join("");
  }

  presetListEl.addEventListener("click", (ev) => {
    const applyBtn = ev.target.closest(".preset-apply-btn");
    const delBtn = ev.target.closest(".preset-del-btn");
    if (applyBtn) {
      const preset = loadFilterPresets().find((p) => p.id === applyBtn.dataset.id);
      if (preset) applyFilterState(preset);
    } else if (delBtn) {
      removeFilterPreset(delBtn.dataset.id);
      renderPresetList();
    }
  });

  presetSaveBtn.addEventListener("click", () => {
    const name = presetNameInput.value.trim() || "名前なしの条件";
    const result = addFilterPreset(name, currentFilterState());
    if (!result.ok && result.reason === "limit") {
      alert("保存できる条件は10個までだよ。使わなくなった条件を削除してから保存してね");
      return;
    }
    presetNameInput.value = "";
    renderPresetList();
  });

  sortSelect.addEventListener("change", refresh);
  hiddenCheckbox.addEventListener("change", refresh);
  walkSelect.addEventListener("change", refresh);
  roomChecksEl.addEventListener("change", refresh);
  modeEl.addEventListener("change", refresh);
  resetBtn.addEventListener("click", () => {
    walkSelect.value = "";
    document.querySelectorAll(".room-filter-checkbox").forEach((cb) => { cb.checked = false; });
    modeEl.querySelector('input[value="and"]').checked = true;
    refresh();
  });
  renderPresetList();
  refresh();
})();
</script>
</body>
</html>
