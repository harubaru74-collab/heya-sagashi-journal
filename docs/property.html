<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>物件詳細 | お部屋探しジャーナル</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yomogi&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page" id="page">
  <a class="back-link" href="index.html">← 一覧に戻る</a>
  <div id="content"><p class="empty-note">読み込み中だよ…</p></div>
  <footer class="site">heya-sagashi-journal</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<script src="app.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  const content = document.getElementById("content");
  if (!id) { content.innerHTML = '<p class="empty-note">物件IDが指定されてないよ</p>'; return; }

  let p, criteria;
  try {
    [p, criteria] = await Promise.all([loadProperty(id), loadCriteria()]);
  } catch (e) {
    content.innerHTML = '<p class="empty-note">物件が見つからなかったよ: ' + e.message + "</p>";
    return;
  }

  const sample = p.isSample ? '<span class="sample-tag">サンプルデータ</span>' : "";

  const goodHtml = (p.score.goodPoints || []).map((t) =>
    '<li><span class="point-marker">✓</span><span>' + t + "</span></li>").join("");
  const concernHtml = (p.score.concernPoints || []).map((t) =>
    '<li><span class="point-marker">!</span><span>' + t + "</span></li>").join("");

  const costLine = (p.costBreakdown || []).length
    ? formatYen(p.initialCostEstimate) + '<span class="detail-sub">(' + p.costBreakdown.map((c) => c.label + " " + formatYen(c.amount)).join("・") + ")</span>"
    : formatYen(p.initialCostEstimate);

  const commuteLine = p.commute.destinationStationName + "まで" + p.commute.minutes + "分(乗り換え" + p.commute.transfers + "回)" +
    (p.commute.route ? '<span class="detail-sub">' + p.commute.route + "</span>" : "") +
    (p.commute.leisure ? '<span class="detail-sub">🎡 ' + p.commute.leisure + "</span>" : "");

  const areaGuideText = (p.surroundings && (p.surroundings.areaGuide || p.surroundings.safetyNote)) ||
    "エリアの解説はまだ登録されてないよ";

  content.innerHTML =
    '<div id="gallery"></div>' +
    "<h1>" + p.name + sample + "</h1>" +
    '<p class="meta" style="color:#8e879c;">' + p.address + " ・ " + p.nearestStation + "駅 徒歩" + p.walkMinutesToStation + "分</p>" +

    '<div class="summary-box">' +
      '<div class="match">マッチ度 ' + p.score.matchPercent + "%(" + p.score.grade + ")</div>" +
      "<p>" + p.score.summary + "</p>" +
      '<ul class="point-list good">' + goodHtml + "</ul>" +
      '<ul class="point-list concern">' + concernHtml + "</ul>" +
    "</div>" +

    '<div class="checklist-box">' +
      "<h3>🏠 お部屋の中身</h3>" +
      '<div id="checklist"></div>' +
    "</div>" +

    '<div class="charts-grid">' +
      '<div class="chart-box"><canvas id="lifeChart"></canvas><h3>お部屋+周辺環境</h3></div>' +
    "</div>" +

    '<div class="area-guide">' +
      "<h3>📍 このエリアについて</h3>" +
      "<p>" + areaGuideText + "</p>" +
    "</div>" +

    '<div class="checklist-box">' +
      "<h3>🚉 最寄り駅・路線</h3>" +
      '<div id="stations"></div>' +
    "</div>" +

    '<div class="checklist-box">' +
      "<h3>🚶 周辺施設</h3>" +
      '<div id="facilities"></div>' +
    "</div>" +

    "<table class=\"detail-table\">" +
      "<tr><th>間取り・広さ</th><td>" + p.layout + " / " + p.sizeSqm + "㎡</td></tr>" +
      "<tr><th>家賃総額</th><td>" + formatYen(p.rent.total) + (p.rent.freeInternet ? "(ネット込み実質 " + formatYen(p.rent.effectiveTotal) + ")" : "") + "</td></tr>" +
      "<tr><th>初期費用目安</th><td>" + costLine + "</td></tr>" +
      "<tr><th>通勤</th><td>" + commuteLine + "</td></tr>" +
      '<tr><th>ステータス</th><td id="status-cell"></td></tr>' +
      "<tr><th>元の物件URL</th><td><a href=\"" + p.sourceUrl + "\" target=\"_blank\" rel=\"noopener\">ポータルサイトで見る</a></td></tr>" +
    "</table>";

  renderPhotoGallery(document.getElementById("gallery"), p.images, p.imageUrl);
  renderRoomChecklist(document.getElementById("checklist"), criteria, p);
  renderNearbyStations(document.getElementById("stations"), p.nearbyStations);
  renderFacilityList(document.getElementById("facilities"), p.surroundings && p.surroundings.facilities);
  renderStatusControl(document.getElementById("status-cell"), p, criteria);
  drawRadarChart(document.getElementById("lifeChart"), LIFE_AXIS_LABELS, p.radar.lifeAxes, "#7fc8e8", buildLifeAxisCaptions(p));
})();
</script>
</body>
</html>
